<circle cx="204" cy="1219" r="6" fill="#e2e8f0"/>
<path d="M 60 1252 h 926 l 14 14 v 72 h -940 v -86 z" fill="#111c31" stroke="#fbbf24" stroke-dasharray="4 3"/>
<text x="72" y="1272" font-family="'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#fbbf24">Diagnosis rule learned here:</text>
<text x="72" y="1288" font-family="'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#fbbf24">a defect with no log on the node you</text>
<text x="72" y="1304" font-family="'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#fbbf24">suspect is a reason to read the peer's</text>
<text x="72" y="1320" font-family="'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#fbbf24">log, not a reason to doubt the report.</text>
<text x="36" y="1384" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5" fill="#64748b">Fixed in 281a75149622 — cache_key_append()'s -EBUSY now takes the same seg_wait backpressure as cache_data_alloc.</text>
