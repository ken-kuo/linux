<rect width="1060" height="1406" fill="url(#bg)"/>
<text x="36" y="44" font-family="'Segoe UI',Arial,sans-serif" font-size="22" font-weight="600" fill="#e2e8f0">#10 — Reproducing: writes silently deferred to the dirty bitmap (multi-stream)</text>
<text x="36" y="70" font-family="'Segoe UI',Arial,sans-serif" font-size="13.5" fill="#94a3b8">demo_features.sh f40 · streams=2 · the Primary logs nothing, which is what made this hard to find</text>
