<text x="204" y="378" text-anchor="middle" font-family="'JetBrains Mono','Consolas',monospace" font-size="11.5" font-weight="400" fill="#eff6ff">4 fio jobs x 4K randwrite</text>
<text x="204" y="395" text-anchor="middle" font-family="'JetBrains Mono','Consolas',monospace" font-size="11.5" font-weight="400" fill="#eff6ff">over ONE 8 MiB region, 25 s</text>
<path d="M 204 416 L 204 430 L 876 430 L 876 442" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a-gr)"/>
<rect x="742" y="442" width="268" height="77" rx="9" fill="#78350f" stroke="#fbbf24"/>
<text x="876" y="464" text-anchor="middle" font-family="'JetBrains Mono','Consolas',monospace" font-size="11.5" font-weight="400" fill="#fef3c7">pcache_net_write_to_cache</text>
<text x="876" y="481" text-anchor="middle" font-family="'JetBrains Mono','Consolas',monospace" font-size="11.5" font-weight="400" fill="#fef3c7">wait_seg() absorbs -EBUSY</text>
<text x="876" y="498" text-anchor="middle" font-family="'JetBrains Mono','Consolas',monospace" font-size="11.5" font-weight="400" fill="#fef3c7">from cache_data_alloc</text>
<line x1="876" y1="519" x2="876" y2="545" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a-gr)"/>
<rect x="742" y="545" width="268" height="77" rx="9" fill="#78350f" stroke="#fbbf24"/>
<text x="876" y="567" text-anchor="middle" font-family="'JetBrains Mono','Consolas',monospace" font-size="11.5" font-weight="400" fill="#fef3c7">cache_key_append()</text>
<text x="876" y="584" text-anchor="middle" font-family="'JetBrains Mono','Consolas',monospace" font-size="11.5" font-weight="400" fill="#fef3c7">kset full (128 keys)</text>
<text x="876" y="601" text-anchor="middle" font-family="'JetBrains Mono','Consolas',monospace" font-size="11.5" font-weight="400" fill="#fef3c7">-&gt; cache_kset_close()</text>
<line x1="876" y1="622" x2="876" y2="648" stroke="#f87171" stroke-width="1.6" marker-end="url(#a-bug)"/>
<rect x="742" y="648" width="268" height="77" rx="9" fill="#7f1d1d" stroke="#f87171"/>
<text x="876" y="670" text-anchor="middle" font-family="'JetBrains Mono','Consolas',monospace" font-size="11.5" font-weight="400" fill="#fee2e2">get_cache_segment() -&gt; no segment</text>
<text x="876" y="687" text-anchor="middle" font-family="'JetBrains Mono','Consolas',monospace" font-size="11.5" font-weight="700" fill="#fee2e2">-EBUSY returned, no wait</text>
<text x="876" y="704" text-anchor="middle" font-family="'JetBrains Mono','Consolas',monospace" font-size="11.5" font-weight="400" fill="#fee2e2">backpressure covered alloc only</text>
<line x1="876" y1="725" x2="876" y2="751" stroke="#f87171" stroke-width="1.6" marker-end="url(#a-bug)"/>
<rect x="742" y="751" width="268" height="60" rx="9" fill="#7f1d1d" stroke="#f87171"/>
<text x="876" y="773" text-anchor="middle" font-family="'JetBrains Mono','Consolas',monospace" font-size="11.5" font-weight="400" fill="#fee2e2">reply P_NACK</text>
<text x="876" y="790" text-anchor="middle" font-family="'JetBrains Mono','Consolas',monospace" font-size="11.5" font-weight="400" fill="#fee2e2">dmesg: write to cache failed: -16</text>
<path d="M 876 811 L 876 825 L 550 825 L 550 837" fill="none" stroke="#f87171" stroke-width="1.6" marker-end="url(#a-bug)"/>
<rect x="416" y="837" width="268" height="77" rx="9" fill="#7f1d1d" stroke="#f87171"/>
<text x="550" y="859" text-anchor="middle" font-family="'JetBrains Mono','Consolas',monospace" font-size="11.5" font-weight="400" fill="#fee2e2">pcache_handle_ack: NACK</text>
<text x="550" y="876" text-anchor="middle" font-family="'JetBrains Mono','Consolas',monospace" font-size="11.5" font-weight="400" fill="#fee2e2">-&gt; pcache_bm_set_range()</text>
<text x="550" y="893" text-anchor="middle" font-family="'JetBrains Mono','Consolas',monospace" font-size="11.5" font-weight="700" fill="#fee2e2">silently, with no log line</text>
<path d="M 550 914 L 550 928 L 204 928 L 204 940" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a-gr)"/>
<path d="M 204 940 L 341 974 L 204 1008 L 67 974 Z" fill="#4c1d95" stroke="#c4b5fd"/>
<text x="204" y="964" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="11" fill="#ede9fe">Primary dmesg empty?</text>
<text x="204" y="981" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="11" fill="#ede9fe">read the SECONDARY's</text>
<line x1="204" y1="1008" x2="204" y2="1034" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a-gr)"/>
<text x="212" y="1021" text-anchor="start" font-family="'JetBrains Mono',monospace" font-size="10.5" fill="#94a3b8">[yes]</text>
<rect x="70" y="1034" width="268" height="60" rx="9" fill="#1d4ed8" stroke="#60a5fa"/>
<text x="204" y="1056" text-anchor="middle" font-family="'JetBrains Mono','Consolas',monospace" font-size="11.5" font-weight="400" fill="#eff6ff">result: bm_dirty = 36, md5 differs</text>
<text x="204" y="1073" text-anchor="middle" font-family="'JetBrains Mono','Consolas',monospace" font-size="11.5" font-weight="400" fill="#eff6ff">streams=1 control: identical</text>
<line x1="204" y1="1094" x2="204" y2="1120" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a-gr)"/>
<rect x="70" y="1120" width="268" height="60" rx="9" fill="#134e4a" stroke="#2dd4bf" stroke-dasharray="5 3"/>
<text x="204" y="1142" text-anchor="middle" font-family="'JetBrains Mono','Consolas',monospace" font-size="11.5" font-weight="400" fill="#ccfbf1">after fix: retry the chunk on -EBUSY</text>
<text x="204" y="1159" text-anchor="middle" font-family="'JetBrains Mono','Consolas',monospace" font-size="11.5" font-weight="400" fill="#ccfbf1">0 failures / bm_dirty 0 / identical</text>
<line x1="204" y1="1180" x2="204" y2="1208" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a-gr)"/>
