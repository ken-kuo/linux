<rect width="1060" height="1278" fill="url(#bg)"/>
<text x="36" y="44" font-family="'Segoe UI',Arial,sans-serif" font-size="22" font-weight="600" fill="#e2e8f0">#11 — Reproducing: GFP_NOWAIT fan-out silently drops replication under memory pressure</text>
<text x="36" y="70" font-family="'Segoe UI',Arial,sans-serif" font-size="13.5" fill="#94a3b8">demo_features.sh f45 (from drbd9-tests/tests/bitmap-oom) · the link is perfectly healthy throughout</text>
<rect x="36" y="92" width="336" height="1130" rx="8" fill="#0b1220" stroke="#243044"/>
<text x="204" y="116" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#94a3b8">test driver</text>
<line x1="36" y1="126" x2="372" y2="126" stroke="#243044"/>
<rect x="382" y="92" width="336" height="1130" rx="8" fill="#0b1220" stroke="#243044"/>
<text x="550" y="116" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#94a3b8">Primary (node-1)</text>
<line x1="382" y1="126" x2="718" y2="126" stroke="#243044"/>
<rect x="728" y="92" width="296" height="1130" rx="8" fill="#0b1220" stroke="#243044"/>
<text x="876" y="116" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#94a3b8">Secondary (node-2)</text>
<line x1="728" y1="126" x2="1024" y2="126" stroke="#243044"/>
<circle cx="204" cy="150" r="8" fill="#e2e8f0"/>
<line x1="204" y1="158" x2="204" y2="176" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a-gr)"/>
<rect x="70" y="176" width="268" height="77" rx="9" fill="#1d4ed8" stroke="#60a5fa"/>
<text x="204" y="198" text-anchor="middle" font-family="'JetBrains Mono','Consolas',monospace" font-size="11.5" font-weight="400" fill="#eff6ff">mem_hog_start: 60% of MemAvailable</text>
<text x="204" y="215" text-anchor="middle" font-family="'JetBrains Mono','Consolas',monospace" font-size="11.5" font-weight="400" fill="#eff6ff">on BOTH nodes, no swap,</text>
<text x="204" y="232" text-anchor="middle" font-family="'JetBrains Mono','Consolas',monospace" font-size="11.5" font-weight="400" fill="#eff6ff">oom_score_adj=1000</text>
<line x1="204" y1="253" x2="204" y2="279" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a-gr)"/>
<rect x="70" y="279" width="268" height="60" rx="9" fill="#1d4ed8" stroke="#60a5fa"/>
<text x="204" y="301" text-anchor="middle" font-family="'JetBrains Mono','Consolas',monospace" font-size="11.5" font-weight="400" fill="#eff6ff">poll RSS until the hog is resident</text>
<text x="204" y="318" text-anchor="middle" font-family="'JetBrains Mono','Consolas',monospace" font-size="11.5" font-weight="400" fill="#eff6ff">(DRBD's mem_alloc.py does the same)</text>
<line x1="204" y1="339" x2="204" y2="365" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a-gr)"/>
<rect x="70" y="365" width="268" height="60" rx="9" fill="#1d4ed8" stroke="#60a5fa"/>
<text x="204" y="387" text-anchor="middle" font-family="'JetBrains Mono','Consolas',monospace" font-size="11.5" font-weight="400" fill="#eff6ff">start writer, then issue an admin</text>
<text x="204" y="404" text-anchor="middle" font-family="'JetBrains Mono','Consolas',monospace" font-size="11.5" font-weight="400" fill="#eff6ff">command (add-peer / remove-peer)</text>
<path d="M 204 425 L 204 439 L 550 439 L 550 451" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a-gr)"/>
<rect x="416" y="451" width="268" height="60" rx="9" fill="#065f46" stroke="#34d399"/>
<text x="550" y="473" text-anchor="middle" font-family="'JetBrains Mono','Consolas',monospace" font-size="11.5" font-weight="400" fill="#ecfdf5">pcache_net_submit_write()</text>
<text x="550" y="490" text-anchor="middle" font-family="'JetBrains Mono','Consolas',monospace" font-size="11.5" font-weight="400" fill="#ecfdf5">mempool_alloc(req_pool, ...)</text>
<line x1="550" y1="511" x2="550" y2="537" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a-gr)"/>
<path d="M 550 537 L 687 562 L 550 588 L 413 562 Z" fill="#4c1d95" stroke="#c4b5fd"/>
<text x="550" y="561" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="11" fill="#ede9fe">allocation succeeded?</text>
<line x1="550" y1="588" x2="550" y2="614" stroke="#f87171" stroke-width="1.6" marker-end="url(#a-bug)"/>
<text x="558" y="601" text-anchor="start" font-family="'JetBrains Mono',monospace" font-size="10.5" fill="#94a3b8">[no]</text>
<rect x="416" y="614" width="268" height="77" rx="9" fill="#7f1d1d" stroke="#f87171"/>
<text x="550" y="636" text-anchor="middle" font-family="'JetBrains Mono','Consolas',monospace" font-size="11.5" font-weight="400" fill="#fee2e2">GFP_NOWAIT: skip this peer,</text>
<text x="550" y="653" text-anchor="middle" font-family="'JetBrains Mono','Consolas',monospace" font-size="11.5" font-weight="700" fill="#fee2e2">pcache_bm_set_range() instead</text>
<text x="550" y="670" text-anchor="middle" font-family="'JetBrains Mono','Consolas',monospace" font-size="11.5" font-weight="400" fill="#fee2e2">replicated -&gt; merely owed</text>
<line x1="550" y1="691" x2="550" y2="717" stroke="#f87171" stroke-width="1.6" marker-end="url(#a-bug)"/>
<rect x="416" y="717" width="268" height="77" rx="9" fill="#7f1d1d" stroke="#f87171"/>
<text x="550" y="739" text-anchor="middle" font-family="'JetBrains Mono','Consolas',monospace" font-size="11.5" font-weight="400" fill="#fee2e2">repl_state stays ESTABLISHED</text>
<text x="550" y="756" text-anchor="middle" font-family="'JetBrains Mono','Consolas',monospace" font-size="11.5" font-weight="700" fill="#fee2e2">nothing drains those bits</text>
<text x="550" y="773" text-anchor="middle" font-family="'JetBrains Mono','Consolas',monospace" font-size="11.5" font-weight="400" fill="#fee2e2">(see #10's residual gap)</text>
<path d="M 550 794 L 550 808 L 204 808 L 204 820" fill="none" stroke="#f87171" stroke-width="1.6" marker-end="url(#a-bug)"/>
<rect x="70" y="820" width="268" height="60" rx="9" fill="#7f1d1d" stroke="#f87171"/>
<text x="204" y="842" text-anchor="middle" font-family="'JetBrains Mono','Consolas',monospace" font-size="11.5" font-weight="400" fill="#fee2e2">result: Secondary is silently stale</text>
<text x="204" y="859" text-anchor="middle" font-family="'JetBrains Mono','Consolas',monospace" font-size="11.5" font-weight="400" fill="#fee2e2">for as long as the cluster stays up</text>
<line x1="204" y1="880" x2="204" y2="906" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a-gr)"/>
<rect x="70" y="906" width="268" height="60" rx="9" fill="#134e4a" stroke="#2dd4bf" stroke-dasharray="5 3"/>
<text x="204" y="928" text-anchor="middle" font-family="'JetBrains Mono','Consolas',monospace" font-size="11.5" font-weight="400" fill="#ccfbf1">fix: back to GFP_NOIO -- throttle,</text>
<text x="204" y="945" text-anchor="middle" font-family="'JetBrains Mono','Consolas',monospace" font-size="11.5" font-weight="400" fill="#ccfbf1">never reject (DRBD drbd_alloc_pages)</text>
<line x1="204" y1="966" x2="204" y2="992" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a-gr)"/>
<rect x="70" y="992" width="268" height="60" rx="9" fill="#134e4a" stroke="#2dd4bf" stroke-dasharray="5 3"/>
<text x="204" y="1014" text-anchor="middle" font-family="'JetBrains Mono','Consolas',monospace" font-size="11.5" font-weight="400" fill="#ccfbf1">measured: admin cmd 0 s, io_errors 0,</text>
<text x="204" y="1031" text-anchor="middle" font-family="'JetBrains Mono','Consolas',monospace" font-size="11.5" font-weight="400" fill="#ccfbf1">converged after pressure released</text>
<line x1="204" y1="1052" x2="204" y2="1080" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a-gr)"/>
<circle cx="204" cy="1091" r="11" fill="none" stroke="#e2e8f0" stroke-width="2"/>
<circle cx="204" cy="1091" r="6" fill="#e2e8f0"/>
<path d="M 60 1124 h 926 l 14 14 v 72 h -940 v -86 z" fill="#111c31" stroke="#2dd4bf" stroke-dasharray="4 3"/>
<text x="72" y="1144" font-family="'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#2dd4bf">Why blocking is safe here:</text>
<text x="72" y="1160" font-family="'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#2dd4bf">peers_lock is a percpu_rwsem and this</text>
<text x="72" y="1176" font-family="'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#2dd4bf">is its read side -- sleeping delays a</text>
<text x="72" y="1192" font-family="'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#2dd4bf">pending writer, it cannot deadlock.</text>
<text x="36" y="1256" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5" fill="#64748b">Fixed in 8e066e7cbdaa — DRBD throttles buffer allocation via schedule_timeout and only NEG_ACKs on a real I/O error.</text>
</svg>