<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1294">
<defs>
<linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="100%" stop-color="#1e293b"/></linearGradient>
<marker id="a-gr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker>
<marker id="a-bug" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f87171"/></marker>
<marker id="a-fix" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2dd4bf"/></marker>
</defs>
<rect width="1080" height="1294" fill="url(#bg)"/>
<text x="36" y="44" font-family="'Segoe UI',Arial,sans-serif" font-size="22" font-weight="600" fill="#e2e8f0">#17 — Why teardown panics on a task_struct that was freed long before</text>
<text x="36" y="70" font-family="'Segoe UI',Arial,sans-serif" font-size="13.5" fill="#94a3b8">The cause, not the recipe: kthread_run() hands back a pointer it holds no reference to, and a worker that retires on a recoverable error leaves that pointer behind</text>
<rect x="36" y="92" width="330" height="1005" rx="8" fill="#0b1220" stroke="#243044"/>
<text x="201.0" y="116" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#94a3b8">Secondary control worker (kthread)</text>
<line x1="36" y1="126" x2="366" y2="126" stroke="#243044"/>
<rect x="396" y="92" width="300" height="1005" rx="8" fill="#0b1220" stroke="#243044"/>
<text x="546.0" y="116" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#94a3b8">its task_struct / slab</text>
<line x1="396" y1="126" x2="696" y2="126" stroke="#243044"/>
<rect x="726" y="92" width="318" height="1005" rx="8" fill="#0b1220" stroke="#243044"/>
<text x="885.0" y="116" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#94a3b8">teardown: dmsetup remove -&gt; dm_pcache_dtr</text>
<line x1="726" y1="126" x2="1044" y2="126" stroke="#243044"/>
<circle cx="201.0" cy="150" r="8" fill="#e2e8f0"/>
<line x1="201.0" y1="158" x2="201.0" y2="176" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a-gr)"/>
<rect x="67.0" y="176" width="268" height="69" rx="9" fill="#065f46" stroke="#34d399"/>
<text x="201.0" y="197" text-anchor="middle" font-family="'JetBrains Mono','Consolas',monospace" font-size="11.5" font-weight="400" fill="#ecfdf5">pcache_start_secondary():</text>
<text x="201.0" y="214" text-anchor="middle" font-family="'JetBrains Mono','Consolas',monospace" font-size="11.5" font-weight="400" fill="#ecfdf5">t = kthread_run(...)</text>
<text x="201.0" y="231" text-anchor="middle" font-family="'JetBrains Mono','Consolas',monospace" font-size="11.5" font-weight="700" fill="#ecfdf5">peer-&gt;streams[0].receiver = t</text>
<path d="M 201.0 245 L 201.0 259 L 546.0 259 L 546.0 273" fill="none" stroke="#f87171" stroke-width="1.6" marker-end="url(#a-bug)"/>
<rect x="412.0" y="273" width="268" height="103" rx="9" fill="#7f1d1d" stroke="#f87171"/>
<text x="546.0" y="294" text-anchor="middle" font-family="'JetBrains Mono','Consolas',monospace" font-size="11.5" font-weight="400" fill="#fee2e2">kthread_create_on_node() returns a</text>
<text x="546.0" y="311" text-anchor="middle" font-family="'JetBrains Mono','Consolas',monospace" font-size="11.5" font-weight="700" fill="#fee2e2">BARE pointer -- it takes NO</text>
<text x="546.0" y="328" text-anchor="middle" font-family="'JetBrains Mono','Consolas',monospace" font-size="11.5" font-weight="400" fill="#fee2e2">reference for the creator.</text>
<text x="546.0" y="345" text-anchor="middle" font-family="'JetBrains Mono','Consolas',monospace" font-size="11.5" font-weight="400" fill="#fee2e2">The task is kept alive only by</text>
<text x="546.0" y="362" text-anchor="middle" font-family="'JetBrains Mono','Consolas',monospace" font-size="11.5" font-weight="400" fill="#fee2e2">the fact that it is still running.</text>
<rect x="67.0" y="400" width="268" height="52" rx="9" fill="#78350f" stroke="#fbbf24"/>
<text x="201.0" y="421" text-anchor="middle" font-family="'JetBrains Mono','Consolas',monospace" font-size="11.5" font-weight="400" fill="#fef3c7">F42 injects a resync write failure</text>
<text x="201.0" y="438" text-anchor="middle" font-family="'JetBrains Mono','Consolas',monospace" font-size="11.5" font-weight="400" fill="#fef3c7">pcache_handle_rs_data_recv() -&gt; -EIO</text>
<line x1="201.0" y1="245" x2="201.0" y2="400" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a-gr)"/>
<rect x="67.0" y="478" width="268" height="69" rx="9" fill="#7f1d1d" stroke="#f87171"/>
<text x="201.0" y="499" text-anchor="middle" font-family="'JetBrains Mono','Consolas',monospace" font-size="11.5" font-weight="400" fill="#fee2e2">the RS_DATA error path did</text>
<text x="201.0" y="516" text-anchor="middle" font-family="'JetBrains Mono','Consolas',monospace" font-size="11.5" font-weight="700" fill="#fee2e2">goto out  -- the worker RETURNS</text>
<text x="201.0" y="533" text-anchor="middle" font-family="'JetBrains Mono','Consolas',monospace" font-size="11.5" font-weight="400" fill="#fee2e2">instead of goto wait_sock</text>
<line x1="201.0" y1="452" x2="201.0" y2="478" stroke="#f87171" stroke-width="1.6" marker-end="url(#a-bug)"/>
<rect x="67.0" y="573" width="268" height="52" rx="9" fill="#1e293b" stroke="#64748b"/>
<text x="201.0" y="594" text-anchor="middle" font-family="'JetBrains Mono','Consolas',monospace" font-size="11.5" font-weight="400" fill="#e2e8f0">thread exits -&gt; release_task()</text>
<text x="201.0" y="611" text-anchor="middle" font-family="'JetBrains Mono','Consolas',monospace" font-size="11.5" font-weight="400" fill="#e2e8f0">-&gt; RCU -&gt; kmem_cache_free()</text>
<line x1="201.0" y1="547" x2="201.0" y2="573" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a-gr)"/>
<path d="M 201.0 625 L 201.0 639 L 546.0 639 L 546.0 653" fill="none" stroke="#f87171" stroke-width="1.6" marker-end="url(#a-bug)"/>
<rect x="412.0" y="653" width="268" height="86" rx="9" fill="#7f1d1d" stroke="#f87171"/>
<text x="546.0" y="674" text-anchor="middle" font-family="'JetBrains Mono','Consolas',monospace" font-size="11.5" font-weight="700" fill="#fee2e2">task_struct FREED.</text>
<text x="546.0" y="691" text-anchor="middle" font-family="'JetBrains Mono','Consolas',monospace" font-size="11.5" font-weight="400" fill="#fee2e2">peer-&gt;streams[0].receiver still</text>
<text x="546.0" y="708" text-anchor="middle" font-family="'JetBrains Mono','Consolas',monospace" font-size="11.5" font-weight="400" fill="#fee2e2">points at it. The slab object is</text>
<text x="546.0" y="725" text-anchor="middle" font-family="'JetBrains Mono','Consolas',monospace" font-size="11.5" font-weight="400" fill="#fee2e2">reused by an unrelated clone().</text>
<rect x="67.0" y="763" width="268" height="52" rx="9" fill="#78350f" stroke="#fbbf24"/>
<text x="201.0" y="784" text-anchor="middle" font-family="'JetBrains Mono','Consolas',monospace" font-size="11.5" font-weight="400" fill="#fef3c7">nobody services the peer, yet</text>
<text x="201.0" y="801" text-anchor="middle" font-family="'JetBrains Mono','Consolas',monospace" font-size="11.5" font-weight="400" fill="#fef3c7">peer-&gt;state stays CONNECTED</text>
<line x1="201.0" y1="625" x2="201.0" y2="763" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a-gr)"/>
<rect x="67.0" y="841" width="268" height="69" rx="9" fill="#7f1d1d" stroke="#f87171"/>
<text x="201.0" y="862" text-anchor="middle" font-family="'JetBrains Mono','Consolas',monospace" font-size="11.5" font-weight="400" fill="#fee2e2">accept: "already connected;</text>
<text x="201.0" y="879" text-anchor="middle" font-family="'JetBrains Mono','Consolas',monospace" font-size="11.5" font-weight="400" fill="#fee2e2">drop dup"  once a second, for</text>
<text x="201.0" y="896" text-anchor="middle" font-family="'JetBrains Mono','Consolas',monospace" font-size="11.5" font-weight="700" fill="#fee2e2">the life of the device</text>
<line x1="201.0" y1="815" x2="201.0" y2="841" stroke="#f87171" stroke-width="1.6" marker-end="url(#a-bug)"/>
<circle cx="885.0" cy="150" r="8" fill="#e2e8f0"/>
<line x1="885.0" y1="158" x2="885.0" y2="790" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a-gr)"/>
<rect x="745.0" y="790" width="280" height="86" rx="9" fill="#1e293b" stroke="#64748b"/>
<text x="885.0" y="811" text-anchor="middle" font-family="'JetBrains Mono','Consolas',monospace" font-size="11.5" font-weight="400" fill="#e2e8f0">pcache_net_stop():</text>
<text x="885.0" y="828" text-anchor="middle" font-family="'JetBrains Mono','Consolas',monospace" font-size="11.5" font-weight="400" fill="#e2e8f0">sender == NULL (this node is</text>
<text x="885.0" y="845" text-anchor="middle" font-family="'JetBrains Mono','Consolas',monospace" font-size="11.5" font-weight="700" fill="#e2e8f0">Secondary), so take the</text>
<text x="885.0" y="862" text-anchor="middle" font-family="'JetBrains Mono','Consolas',monospace" font-size="11.5" font-weight="400" fill="#e2e8f0">else if (receiver) branch</text>
<line x1="885.0" y1="876" x2="885.0" y2="902" stroke="#f87171" stroke-width="1.6" marker-end="url(#a-bug)"/>
<rect x="745.0" y="902" width="280" height="69" rx="9" fill="#7f1d1d" stroke="#f87171"/>
<text x="885.0" y="923" text-anchor="middle" font-family="'JetBrains Mono','Consolas',monospace" font-size="11.5" font-weight="400" fill="#fee2e2">kthread_stop(receiver)</text>
<text x="885.0" y="940" text-anchor="middle" font-family="'JetBrains Mono','Consolas',monospace" font-size="11.5" font-weight="700" fill="#fee2e2">-&gt; get_task_struct() writes 4</text>
<text x="885.0" y="957" text-anchor="middle" font-family="'JetBrains Mono','Consolas',monospace" font-size="11.5" font-weight="400" fill="#fee2e2">bytes into freed memory</text>
<line x1="885.0" y1="971" x2="885.0" y2="997" stroke="#f87171" stroke-width="1.6" marker-end="url(#a-bug)"/>
<rect x="745.0" y="997" width="280" height="86" rx="9" fill="#7f1d1d" stroke="#f87171"/>
<text x="885.0" y="1018" text-anchor="middle" font-family="'JetBrains Mono','Consolas',monospace" font-size="11.5" font-weight="700" fill="#fee2e2">KASAN: slab-use-after-free</text>
<text x="885.0" y="1035" text-anchor="middle" font-family="'JetBrains Mono','Consolas',monospace" font-size="11.5" font-weight="400" fill="#fee2e2">refcount_t: addition on 0</text>
<text x="885.0" y="1052" text-anchor="middle" font-family="'JetBrains Mono','Consolas',monospace" font-size="11.5" font-weight="400" fill="#fee2e2">NULL deref in kthread_stop</text>
<text x="885.0" y="1069" text-anchor="middle" font-family="'JetBrains Mono','Consolas',monospace" font-size="11.5" font-weight="700" fill="#fee2e2">Kernel panic</text>
<rect x="60" y="1117" width="960" height="137" rx="9" fill="#134e4a" stroke="#2dd4bf"/>
<text x="84" y="1138" font-family="'JetBrains Mono','Consolas',monospace" font-size="11.5" font-weight="700" fill="#ccfbf1">FIX  (a) get_task_struct() right after every kthread_run(); kthread_stop_put() at every stop site.</text>
<text x="84" y="1155" font-family="'JetBrains Mono','Consolas',monospace" font-size="11.5" font-weight="400" fill="#ccfbf1">     A held reference makes the pointer valid past the thread's own exit -- struct kthread is freed from</text>
<text x="84" y="1172" font-family="'JetBrains Mono','Consolas',monospace" font-size="11.5" font-weight="400" fill="#ccfbf1">     free_task(), and kthread-&gt;exited is already complete, so stopping an exited thread returns at once.</text>
<text x="84" y="1189" font-family="'JetBrains Mono','Consolas',monospace" font-size="11.5" font-weight="400" fill="#ccfbf1">     Claim (read-and-clear) each field before stopping, so exactly one caller stops it and one drops the ref.</text>
<text x="84" y="1206" font-family="'JetBrains Mono','Consolas',monospace" font-size="11.5" font-weight="400" fill="#ccfbf1">     Because a redundant stop is now safe, the fragile "the sender owns its receiver" rule is gone.</text>
<text x="84" y="1223" font-family="'JetBrains Mono','Consolas',monospace" font-size="11.5" font-weight="700" fill="#ccfbf1">(b) The RS_DATA and BITMAP_DONE error paths go back to wait_sock, not out: "the resync resumes on</text>
<text x="84" y="1240" font-family="'JetBrains Mono','Consolas',monospace" font-size="11.5" font-weight="400" fill="#ccfbf1">     reconnect" needs this worker to still be alive to accept that reconnect.</text>
</svg>
