<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 1329">
<defs>
<linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#0f172a"/><stop offset="100%" stop-color="#1e293b"/>
</linearGradient>
<marker id="a-drv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#60a5fa"/></marker>
<marker id="a-pri" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#34d399"/></marker>
<marker id="a-sec" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#fbbf24"/></marker>
<marker id="a-bug" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f87171"/></marker>
<marker id="a-fix" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2dd4bf"/></marker>
<marker id="a-dec" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c4b5fd"/></marker>
<marker id="a-gr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker>
</defs>
<rect width="1060" height="1329" fill="url(#bg)"/>
<text x="36" y="44" font-family="'Segoe UI',Arial,sans-serif" font-size="22" font-weight="600" fill="#e2e8f0">#13 — Reproducing: a peer's NACK is turned into an I/O error for the application</text>
<text x="36" y="70" font-family="'Segoe UI',Arial,sans-serif" font-size="13.5" fill="#94a3b8">demo_features.sh f41 · originally found by racing dmsetup remove against live write load (F37)</text>
<rect x="36" y="92" width="336" height="1181" rx="8" fill="#0b1220" stroke="#243044"/>
<text x="204" y="116" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#94a3b8">test driver</text>
<line x1="36" y1="126" x2="372" y2="126" stroke="#243044"/>
<rect x="382" y="92" width="336" height="1181" rx="8" fill="#0b1220" stroke="#243044"/>
<text x="550" y="116" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#94a3b8">Primary (node-1)</text>
<line x1="382" y1="126" x2="718" y2="126" stroke="#243044"/>
<rect x="728" y="92" width="296" height="1181" rx="8" fill="#0b1220" stroke="#243044"/>
<text x="876" y="116" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#94a3b8">Secondary (node-2)</text>
<line x1="728" y1="126" x2="1024" y2="126" stroke="#243044"/>
<circle cx="204" cy="150" r="8" fill="#e2e8f0"/>
<line x1="204" y1="158" x2="204" y2="176" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a-gr)"/>
<rect x="70" y="176" width="268" height="77" rx="9" fill="#1d4ed8" stroke="#60a5fa"/>
<text x="204" y="198" text-anchor="middle" font-family="'JetBrains Mono','Consolas',monospace" font-size="11.5" font-weight="400" fill="#eff6ff">fault_arm node-2 rate=30</text>
<text x="204" y="215" text-anchor="middle" font-family="'JetBrains Mono','Consolas',monospace" font-size="11.5" font-weight="400" fill="#eff6ff">type=PCACHE_FAULT_DATA_WRITE</text>
<text x="204" y="232" text-anchor="middle" font-family="'JetBrains Mono','Consolas',monospace" font-size="11.5" font-weight="400" fill="#eff6ff">then run the fio writer</text>
<path d="M 204 253 L 204 267 L 550 267 L 550 279" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a-gr)"/>
<rect x="416" y="279" width="268" height="60" rx="9" fill="#065f46" stroke="#34d399"/>
<text x="550" y="301" text-anchor="middle" font-family="'JetBrains Mono','Consolas',monospace" font-size="11.5" font-weight="400" fill="#ecfdf5">replicated write: local commit</text>
<text x="550" y="318" text-anchor="middle" font-family="'JetBrains Mono','Consolas',monospace" font-size="11.5" font-weight="400" fill="#ecfdf5">+ P_DATA to the peer</text>
<path d="M 550 339 L 550 353 L 876 353 L 876 365" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a-gr)"/>
<rect x="742" y="365" width="268" height="77" rx="9" fill="#78350f" stroke="#fbbf24"/>
<text x="876" y="387" text-anchor="middle" font-family="'JetBrains Mono','Consolas',monospace" font-size="11.5" font-weight="400" fill="#fef3c7">pcache_handle_data_recv()</text>
<text x="876" y="404" text-anchor="middle" font-family="'JetBrains Mono','Consolas',monospace" font-size="11.5" font-weight="400" fill="#fef3c7">write to cache fails (-EIO)</text>
<text x="876" y="421" text-anchor="middle" font-family="'JetBrains Mono','Consolas',monospace" font-size="11.5" font-weight="400" fill="#fef3c7">dmesg: write to cache failed: -5</text>
<line x1="876" y1="442" x2="876" y2="468" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a-gr)"/>
<rect x="742" y="468" width="268" height="43" rx="9" fill="#78350f" stroke="#fbbf24"/>
<text x="876" y="490" text-anchor="middle" font-family="'JetBrains Mono','Consolas',monospace" font-size="11.5" font-weight="400" fill="#fef3c7">reply P_NACK</text>
<path d="M 876 511 L 876 525 L 550 525 L 550 537" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a-gr)"/>
<rect x="416" y="537" width="268" height="77" rx="9" fill="#065f46" stroke="#34d399"/>
<text x="550" y="559" text-anchor="middle" font-family="'JetBrains Mono','Consolas',monospace" font-size="11.5" font-weight="400" fill="#ecfdf5">pcache_handle_ack(): NACK</text>
<text x="550" y="576" text-anchor="middle" font-family="'JetBrains Mono','Consolas',monospace" font-size="11.5" font-weight="400" fill="#ecfdf5">-&gt; pcache_bm_set_range()</text>
<text x="550" y="593" text-anchor="middle" font-family="'JetBrains Mono','Consolas',monospace" font-size="11.5" font-weight="400" fill="#ecfdf5">the region is now owed</text>
<line x1="550" y1="614" x2="550" y2="640" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a-gr)"/>
<path d="M 550 640 L 687 674 L 550 708 L 413 674 Z" fill="#4c1d95" stroke="#c4b5fd"/>
<text x="550" y="664" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="11" fill="#ede9fe">quorum configured</text>
<text x="550" y="681" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="11" fill="#ede9fe">AND actually lost?</text>
<line x1="550" y1="708" x2="550" y2="734" stroke="#f87171" stroke-width="1.6" marker-end="url(#a-bug)"/>
<text x="558" y="721" text-anchor="start" font-family="'JetBrains Mono',monospace" font-size="10.5" fill="#94a3b8">[before fix]</text>
<rect x="416" y="734" width="268" height="77" rx="9" fill="#7f1d1d" stroke="#f87171"/>
<text x="550" y="756" text-anchor="middle" font-family="'JetBrains Mono','Consolas',monospace" font-size="11.5" font-weight="700" fill="#fee2e2">pcache_req_put(req, -EIO)</text>
<text x="550" y="773" text-anchor="middle" font-family="'JetBrains Mono','Consolas',monospace" font-size="11.5" font-weight="400" fill="#fee2e2">asked nothing: the data is committed</text>
<text x="550" y="790" text-anchor="middle" font-family="'JetBrains Mono','Consolas',monospace" font-size="11.5" font-weight="400" fill="#fee2e2">locally and the region is marked</text>
<path d="M 550 811 L 550 825 L 204 825 L 204 837" fill="none" stroke="#f87171" stroke-width="1.6" marker-end="url(#a-bug)"/>
<rect x="70" y="837" width="268" height="77" rx="9" fill="#7f1d1d" stroke="#f87171"/>
<text x="204" y="859" text-anchor="middle" font-family="'JetBrains Mono','Consolas',monospace" font-size="11.5" font-weight="400" fill="#fee2e2">result: fio total_err = 5,</text>
<text x="204" y="876" text-anchor="middle" font-family="'JetBrains Mono','Consolas',monospace" font-size="11.5" font-weight="400" fill="#fee2e2">one per NACK -- an operator action</text>
<text x="204" y="893" text-anchor="middle" font-family="'JetBrains Mono','Consolas',monospace" font-size="11.5" font-weight="400" fill="#fee2e2">became a filesystem I/O error</text>
<path d="M 204 914 L 204 928 L 550 928 L 550 940" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a-gr)"/>
<text x="377" y="922" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="10.5" fill="#94a3b8">[no]</text>
<rect x="416" y="940" width="268" height="60" rx="9" fill="#134e4a" stroke="#2dd4bf" stroke-dasharray="5 3"/>
<text x="550" y="962" text-anchor="middle" font-family="'JetBrains Mono','Consolas',monospace" font-size="11.5" font-weight="400" fill="#ccfbf1">fix: complete 0 unless a configured</text>
<text x="550" y="979" text-anchor="middle" font-family="'JetBrains Mono','Consolas',monospace" font-size="11.5" font-weight="400" fill="#ccfbf1">quorum is really lost</text>
<path d="M 550 1000 L 550 1014 L 204 1014 L 204 1026" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a-gr)"/>
<rect x="70" y="1026" width="268" height="77" rx="9" fill="#134e4a" stroke="#2dd4bf" stroke-dasharray="5 3"/>
<text x="204" y="1048" text-anchor="middle" font-family="'JetBrains Mono','Consolas',monospace" font-size="11.5" font-weight="400" fill="#ccfbf1">F41: 33456 injected failures,</text>
<text x="204" y="1065" text-anchor="middle" font-family="'JetBrains Mono','Consolas',monospace" font-size="11.5" font-weight="400" fill="#ccfbf1">user io_errors 0, bm_dirty 130144,</text>
<text x="204" y="1082" text-anchor="middle" font-family="'JetBrains Mono','Consolas',monospace" font-size="11.5" font-weight="400" fill="#ccfbf1">resync repairs it all</text>
<line x1="204" y1="1103" x2="204" y2="1131" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a-gr)"/>
<circle cx="204" cy="1142" r="11" fill="none" stroke="#e2e8f0" stroke-width="2"/>
<circle cx="204" cy="1142" r="6" fill="#e2e8f0"/>
<path d="M 60 1175 h 926 l 14 14 v 72 h -940 v -86 z" fill="#111c31" stroke="#fbbf24" stroke-dasharray="4 3"/>
<text x="72" y="1195" font-family="'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#fbbf24">Same class as #4, which fixed the</text>
<text x="72" y="1211" font-family="'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#fbbf24">-ENOTCONN path and missed this one.</text>
<text x="72" y="1227" font-family="'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#fbbf24">DRBD: P_NEG_ACK degrades the peer's disk</text>
<text x="72" y="1243" font-family="'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#fbbf24">state; the application write still succeeds.</text>
<text x="36" y="1307" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5" fill="#64748b">Fixed in 0d6e720d70e9 — a NACK means the peer owes a resync, not that the user's write failed.</text>
</svg>